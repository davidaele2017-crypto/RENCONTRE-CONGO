# Blueprint Render — permet un déploiement en un clic via "New > Blueprint"
# sur https://dashboard.render.com en pointant sur ce dépôt GitHub.
#
# Plan Starter + disque persistant (pour les photos) + PostgreSQL (pour tout
# le reste : comptes, profils, matchs, messages, commandes). Les données
# survivent aux redéploiements et redémarrages du service.
databases:
  - name: rencontre-congo-db
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: rencontre-congo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false # déjà rempli dans le dashboard avec l'URL Render réelle
      - key: DATABASE_URL
        fromDatabase:
          name: rencontre-congo-db
          property: connectionString
      - key: DATA_DIR
        value: /data
      - key: CINETPAY_API_KEY
        sync: false # à remplir dans le dashboard Render une fois ton compte CinetPay créé
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_CURRENCY
        value: XAF
      - key: TWILIO_ACCOUNT_SID
        sync: false # à remplir dans le dashboard Render une fois ton compte Twilio créé
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
    disk:
      name: rencontre-congo-data
      mountPath: /data
      sizeGB: 1
