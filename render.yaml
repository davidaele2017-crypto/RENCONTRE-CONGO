# Blueprint Render — permet un déploiement en un clic via "New > Blueprint"
# sur https://dashboard.render.com en pointant sur ce dépôt GitHub.
#
# Plan Starter + disque persistant : les données (comptes, matchs, messages,
# photos) survivent aux redéploiements et redémarrages du service.
services:
  - type: web
    name: rencontre-congo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false # déjà rempli dans le dashboard avec l'URL Render réelle
      - key: DATA_DIR
        value: /data
      - key: CINETPAY_API_KEY
        sync: false # à remplir dans le dashboard Render une fois ton compte CinetPay créé
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_CURRENCY
        value: XAF
    disk:
      name: rencontre-congo-data
      mountPath: /data
      sizeGB: 1
